<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vocabulary Battle - Ultimate Arena</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            touch-action: manipulation;
        }

        html, body {
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #030712;
            color: #ffffff;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        /* Responsive Mobile Layout Fix */
        .app-container {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(0.5rem, 2vw, 1rem);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Animated RGB Glow (Feature #9) */
        .rgb-border {
            position: relative;
        }
        .rgb-border::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #ef4444, #3b82f6, #10b981, #f59e0b);
            border-radius: 1.5rem;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.6;
            animation: rgbShift 6s linear infinite;
        }
        @keyframes rgbShift {
            0% { filter: hue-rotate(0deg) blur(8px); }
            100% { filter: hue-rotate(360deg) blur(8px); }
        }

        /* Floating Combo Animation (Feature #1) */
        @keyframes floatCombo {
            0% { transform: scale(0.5) translateY(0); opacity: 0; }
            50% { transform: scale(1.3) translateY(-15px); opacity: 1; }
            100% { transform: scale(1) translateY(-30px); opacity: 0; }
        }
        .combo-popup {
            animation: floatCombo 0.8s ease-out forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-white">

    <div class="app-container max-w-7xl mx-auto w-full">

        <!-- ================= TOP HEADER BAR ================= -->
        <header class="flex justify-between items-center glass-panel p-2 md:p-3 rounded-2xl mb-1 md:mb-2">
            <div class="flex items-center gap-2">
                <span class="text-lg md:text-2xl font-orbitron font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-400 to-cyan-400">
                    VOCAB ARENA
                </span>
                <span id="current-theme-badge" class="text-[10px] bg-indigo-900/60 border border-indigo-500/40 text-indigo-300 font-bold px-2 py-0.5 rounded-lg hidden sm:inline">
                    Cyber Mode
                </span>
            </div>

            <!-- Header Tools (Sound, Theme, Taunt) -->
            <div class="flex items-center gap-2">
                <!-- Theme Selector (Feature #11) -->
                <select id="theme-select" onchange="changeArenaTheme(this.value)" class="bg-slate-900 border border-slate-700 text-xs font-bold p-1.5 rounded-xl text-slate-300">
                    <option value="cyber">🎨 Cyber</option>
                    <option value="lava">🔥 Lava Red</option>
                    <option value="ocean">🌊 Ocean</option>
                    <option value="matrix">🟢 Matrix</option>
                </select>

                <!-- Sound Control (Feature #2) -->
                <button onclick="toggleAudioMute()" id="btn-audio-mute" class="bg-slate-800 border border-slate-700 p-2 rounded-xl text-xs text-amber-400 hover:bg-slate-700">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <!-- Menu Button -->
                <button onclick="openMainMenu()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- ================= ARENA PERMAINAN (FIT HP LANDSCAPE/PORTRAIT) ================= -->
        <main id="game-arena" class="flex-1 grid grid-cols-2 gap-2 md:gap-4 overflow-hidden relative my-auto">

            <!-- TIM MERAH (P1) -->
            <div id="p1-card" class="glass-panel border-2 border-red-500/40 rounded-2xl p-2 md:p-4 flex flex-col justify-between relative overflow-hidden">
                <!-- Combo Overlay Popup -->
                <div id="p1-combo-box" class="absolute top-10 left-1/2 -translate-x-1/2 z-20 pointer-events-none hidden">
                    <span id="p1-combo-text" class="font-orbitron font-black text-2xl text-amber-400 drop-shadow-[0_0_10px_#f59e0b]">2x COMBO!</span>
                </div>

                <!-- Header P1 -->
                <div class="flex justify-between items-center gap-1 border-b border-red-900/40 pb-1">
                    <div class="flex items-center gap-1.5">
                        <span id="p1-avatar" class="text-lg md:text-2xl">🥷</span>
                        <div>
                            <p class="text-[10px] md:text-xs font-orbitron font-bold text-red-400" id="p1-label">P1 MERAH</p>
                            <p class="text-[9px] text-slate-400">Acc: <span id="p1-acc-live" class="text-emerald-400 font-bold">100%</span></p>
                        </div>
                    </div>
                    <span id="p1-score-display" class="font-orbitron font-black text-lg md:text-2xl text-amber-400 bg-red-950/80 px-2 py-0.5 rounded-xl border border-red-500/40">0</span>
                </div>

                <!-- Question Area -->
                <div class="my-1 md:my-2 bg-slate-900/80 border border-red-500/20 rounded-xl p-2 text-center flex-1 flex flex-col items-center justify-center relative">
                    <span class="text-[9px] font-bold text-red-400/80 uppercase tracking-widest">KATA BAHASA INGGRIS</span>
                    <div class="flex items-center justify-center gap-2 w-full">
                        <h2 id="p1-question" class="text-lg md:text-3xl font-orbitron font-black text-white truncate">Ready?</h2>
                        <button onclick="speakWord('p1')" class="text-red-400 text-xs p-1.5 bg-red-900/40 rounded-lg"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <p id="p1-hint-text" class="text-[10px] text-amber-300 font-mono mt-1 hidden"></p>
                </div>

                <!-- Lifelines (50:50, Hint, Freeze Time) (Feature #5) -->
                <div class="grid grid-cols-3 gap-1 mb-1">
                    <button onclick="useFiftyFifty('p1')" id="p1-btn-5050" class="bg-red-950/60 border border-red-500/40 text-red-300 text-[10px] font-bold py-1 rounded-lg">⚡50:50</button>
                    <button onclick="useHint('p1')" id="p1-btn-hint" class="bg-amber-950/60 border border-amber-500/40 text-amber-300 text-[10px] font-bold py-1 rounded-lg">💡Hint</button>
                    <button onclick="useFreezeTime('p1')" id="p1-btn-freeze" class="bg-cyan-950/60 border border-cyan-500/40 text-cyan-300 text-[10px] font-bold py-1 rounded-lg">❄️Freeze</button>
                </div>

                <!-- Answer Grid -->
                <div id="p1-options" class="grid grid-cols-2 gap-1.5 h-2/5">
                    <!-- Dynamic Options -->
                </div>
            </div>

            <!-- TIM BIRU / AI (P2) -->
            <div id="p2-card" class="glass-panel border-2 border-cyan-500/40 rounded-2xl p-2 md:p-4 flex flex-col justify-between relative overflow-hidden">
                <!-- Combo Overlay Popup -->
                <div id="p2-combo-box" class="absolute top-10 left-1/2 -translate-x-1/2 z-20 pointer-events-none hidden">
                    <span id="p2-combo-text" class="font-orbitron font-black text-2xl text-amber-400 drop-shadow-[0_0_10px_#f59e0b]">2x COMBO!</span>
                </div>

                <!-- Header P2 -->
                <div class="flex justify-between items-center gap-1 border-b border-cyan-900/40 pb-1">
                    <div class="flex items-center gap-1.5">
                        <span id="p2-avatar" class="text-lg md:text-2xl">🤖</span>
                        <div>
                            <p class="text-[10px] md:text-xs font-orbitron font-bold text-cyan-400" id="p2-label">P2 BIRU</p>
                            <p class="text-[9px] text-slate-400">Acc: <span id="p2-acc-live" class="text-emerald-400 font-bold">100%</span></p>
                        </div>
                    </div>
                    <span id="p2-score-display" class="font-orbitron font-black text-lg md:text-2xl text-amber-400 bg-cyan-950/80 px-2 py-0.5 rounded-xl border border-cyan-500/40">0</span>
                </div>

                <!-- Question Area -->
                <div class="my-1 md:my-2 bg-slate-900/80 border border-cyan-500/20 rounded-xl p-2 text-center flex-1 flex flex-col items-center justify-center relative">
                    <span class="text-[9px] font-bold text-cyan-400/80 uppercase tracking-widest">KATA BAHASA INGGRIS</span>
                    <div class="flex items-center justify-center gap-2 w-full">
                        <h2 id="p2-question" class="text-lg md:text-3xl font-orbitron font-black text-white truncate">Ready?</h2>
                        <button onclick="speakWord('p2')" class="text-cyan-400 text-xs p-1.5 bg-cyan-900/40 rounded-lg"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <p id="p2-hint-text" class="text-[10px] text-amber-300 font-mono mt-1 hidden"></p>
                </div>

                <!-- Lifelines -->
                <div class="grid grid-cols-3 gap-1 mb-1">
                    <button onclick="useFiftyFifty('p2')" id="p2-btn-5050" class="bg-cyan-950/60 border border-cyan-500/40 text-cyan-300 text-[10px] font-bold py-1 rounded-lg">⚡50:50</button>
                    <button onclick="useHint('p2')" id="p2-btn-hint" class="bg-amber-950/60 border border-amber-500/40 text-amber-300 text-[10px] font-bold py-1 rounded-lg">💡Hint</button>
                    <button onclick="useFreezeTime('p2')" id="p2-btn-freeze" class="bg-cyan-950/60 border border-cyan-500/40 text-cyan-300 text-[10px] font-bold py-1 rounded-lg">❄️Freeze</button>
                </div>

                <!-- Answer Grid -->
                <div id="p2-options" class="grid grid-cols-2 gap-1.5 h-2/5">
                    <!-- Dynamic Options -->
                </div>
            </div>

        </main>

        <!-- ================= LIVE BOTTOM STATUS & TAUNT BAR ================= -->
        <footer class="glass-panel p-2 rounded-2xl flex justify-between items-center text-xs font-orbitron mt-1">
            <!-- Taunt Emoji Bar (Feature #8) -->
            <div class="flex gap-1">
                <button onclick="sendTaunt('🔥')" class="hover:scale-125 transition">🔥</button>
                <button onclick="sendTaunt('😂')" class="hover:scale-125 transition">😂</button>
                <button onclick="sendTaunt('👻')" class="hover:scale-125 transition">👻</button>
                <button onclick="sendTaunt('👑')" class="hover:scale-125 transition">👑</button>
            </div>

            <!-- Live Timer -->
            <div id="live-timer-badge" class="font-black text-amber-400 bg-slate-950 px-3 py-1 rounded-xl border border-amber-500/40 text-sm">
                ⏳ 15s
            </div>

            <!-- Match Info -->
            <div class="text-[10px] text-slate-400 hidden sm:block">
                Mode: <span id="info-mode-label" class="text-indigo-400 font-bold">1 vs 1</span>
            </div>
        </footer>

    </div>

    <!-- ================= MENU UTAMA & PENGATURAN (MODAL) ================= -->
    <div id="main-menu-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="max-w-md w-full bg-slate-900 border-2 border-indigo-500/50 rounded-3xl p-5 space-y-4 shadow-2xl">
            <div class="text-center">
                <h1 class="text-3xl font-orbitron font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-cyan-400">VOCAB ARENA</h1>
                <p class="text-xs text-slate-400">Pengaturan Game & Avatar</p>
            </div>

            <!-- Avatar Selection (Feature #3) -->
            <div>
                <label class="text-xs font-bold text-slate-300 block mb-1">Pilih Avatar Pemain</label>
                <div class="grid grid-cols-4 gap-2 text-center text-xl">
                    <button onclick="selectAvatar('🥷')" class="bg-slate-800 p-2 rounded-xl border border-slate-700 hover:border-indigo-500">🥷</button>
                    <button onclick="selectAvatar('🤖')" class="bg-slate-800 p-2 rounded-xl border border-slate-700 hover:border-indigo-500">🤖</button>
                    <button onclick="selectAvatar('🧙‍♂️')" class="bg-slate-800 p-2 rounded-xl border border-slate-700 hover:border-indigo-500">🧙‍♂️</button>
                    <button onclick="selectAvatar('🐱')" class="bg-slate-800 p-2 rounded-xl border border-slate-700 hover:border-indigo-500">🐱</button>
                </div>
            </div>

            <!-- Game Mode -->
            <div>
                <label class="text-xs font-bold text-slate-300 block mb-1">Mode Permainan</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setMode('2p')" id="mode-btn-2p" class="p-2.5 rounded-xl border-2 border-indigo-500 bg-indigo-950 text-xs font-bold">2 Player (1 vs 1)</button>
                    <button onclick="setMode('ai')" id="mode-btn-ai" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold text-slate-400">Vs Bot AI</button>
                </div>
            </div>

            <!-- Target Score / Win Condition (Feature #6) -->
            <div>
                <label class="text-xs font-bold text-slate-300 block mb-1">Target Kemenangan</label>
                <select id="win-condition-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-xs text-white">
                    <option value="10">First to 10 Points</option>
                    <option value="15" selected>Selesaikan 15 Soal</option>
                    <option value="20">Selesaikan 20 Soal</option>
                </select>
            </div>

            <!-- Action Buttons -->
            <button onclick="startMatchWithConfig()" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-orbitron font-black p-3 rounded-xl text-base shadow-lg">
                🚀 MULAI MATCH
            </button>
        </div>
    </div>

    <!-- ================= REKAP & REVIEW JAWABAN SALAH (MODAL) ================= -->
    <div id="recap-modal" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="max-w-lg w-full bg-slate-900 border-2 border-amber-500 rounded-3xl p-5 space-y-4 shadow-2xl my-auto">
            <div class="text-center">
                <p class="text-xs text-amber-400 font-bold uppercase">MATCH OVER</p>
                <h1 id="winner-title" class="text-3xl font-orbitron font-black text-amber-400">PEMAIN 1 MENANG!</h1>
            </div>

            <!-- Badges Unlocked (Feature #12) -->
            <div id="unlocked-badges" class="flex justify-center gap-2">
                <!-- Injected Badges -->
            </div>

            <!-- Wrong Answer Review List (Feature #10) -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3 max-h-40 overflow-y-auto">
                <h3 class="text-xs font-bold text-amber-300 mb-2">📝 Evaluasi Kata Yang Salah Dijawab:</h3>
                <ul id="wrong-words-list" class="text-xs space-y-1 text-slate-300">
                    <!-- Injected Wrong Words -->
                </ul>
            </div>

            <button onclick="openMainMenu()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-xl text-xs">
                Kembali Ke Menu Utama
            </button>
        </div>
    </div>

    <!-- ================= JAVASCRIPT GAME LOGIC ================= -->
    <script>
        /* SOUND SYNTHESIZER (Feature #2) */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = false;

        function toggleAudioMute() {
            isMuted = !isMuted;
            document.getElementById('btn-audio-mute').innerHTML = isMuted ? `<i class="fa-solid fa-volume-xmark"></i>` : `<i class="fa-solid fa-volume-high"></i>`;
        }

        function playSoundEffect(type) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        /* QUESTION DATABASE */
        const questionsDB = [
            { word: "Cat", correct: "Kucing", wrongs: ["Anjing", "Burung", "Kelinci"] },
            { word: "Book", correct: "Buku", wrongs: ["Pensil", "Meja", "Tas"] },
            { word: "Teacher", correct: "Guru", wrongs: ["Dokter", "Polisi", "Petani"] },
            { word: "Library", correct: "Perpustakaan", wrongs: ["Kantin", "Pasar", "Taman"] },
            { word: "Knowledge", correct: "Pengetahuan", wrongs: ["Mimpi", "Perasaan", "Harapan"] },
            { word: "Environment", correct: "Lingkungan", wrongs: ["Pembangunan", "Kebudayaan", "Ekonomi"] }
        ];

        /* STATE GAME */
        let gameMode = '2p';
        let matchState = {
            p1: { score: 0, combo: 0, totalAns: 0, correctAns: 0, frozen: false },
            p2: { score: 0, combo: 0, totalAns: 0, correctAns: 0, frozen: false },
            questions: [],
            wrongReview: [],
            timer: 15,
            interval: null
        };

        function setMode(m) {
            gameMode = m;
            document.getElementById('info-mode-label').innerText = m === 'ai' ? 'Vs Bot AI' : '1 vs 1';
        }

        function openMainMenu() {
            document.getElementById('recap-modal').classList.add('hidden');
            document.getElementById('main-menu-modal').classList.remove('hidden');
        }

        function selectAvatar(emoji) {
            document.getElementById('p1-avatar').innerText = emoji;
        }

        function changeArenaTheme(theme) {
            document.getElementById('current-theme-badge').innerText = theme.toUpperCase() + " Mode";
            // Feature #11: Multi-theme styling handler
        }

        function startMatchWithConfig() {
            document.getElementById('main-menu-modal').classList.add('hidden');
            matchState.questions = [...questionsDB].sort(() => Math.random() - 0.5);
            matchState.p1 = { score: 0, combo: 0, totalAns: 0, correctAns: 0, frozen: false };
            matchState.p2 = { score: 0, combo: 0, totalAns: 0, correctAns: 0, frozen: false };
            matchState.wrongReview = [];
            
            renderNextQuestion('p1', 0);
            renderNextQuestion('p2', 0);
            startMatchTimer();
        }

        function renderNextQuestion(player, qIdx) {
            if (qIdx >= matchState.questions.length) return endMatch();

            const q = matchState.questions[qIdx];
            document.getElementById(`${player}-question`).innerText = q.word;

            const grid = document.getElementById(`${player}-options`);
            grid.innerHTML = '';

            let opts = [q.correct, ...q.wrongs].sort(() => Math.random() - 0.5);
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-900 border border-slate-700 hover:border-indigo-500 text-white font-bold text-xs rounded-xl p-2 transition active:scale-95";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(player, opt, q.correct, qIdx);
                grid.appendChild(btn);
            });
        }

        function handleAnswer(player, selected, correct, qIdx) {
            matchState[player].totalAns++;

            if (selected === correct) {
                // Feature #1: Combo Multiplier
                matchState[player].combo++;
                const comboBonus = matchState[player].combo > 1 ? matchState[player].combo : 1;
                matchState[player].score += (1 * comboBonus);
                matchState[player].correctAns++;
                
                playSoundEffect('correct');
                showComboPopup(player, matchState[player].combo);
            } else {
                matchState[player].combo = 0;
                playSoundEffect('wrong');
                // Feature #10: Track wrong answers for review
                matchState.wrongReview.push({ word: matchState.questions[qIdx].word, correct: correct, userAns: selected });
            }

            // Feature #7: Real-time accuracy updates
            const acc = Math.round((matchState[player].correctAns / matchState[player].totalAns) * 100);
            document.getElementById(`${player}-acc-live`).innerText = `${acc}%`;
            document.getElementById(`${player}-score-display`).innerText = matchState[player].score;

            renderNextQuestion(player, qIdx + 1);
        }

        function showComboPopup(player, combo) {
            if (combo < 2) return;
            const box = document.getElementById(`${player}-combo-box`);
            const text = document.getElementById(`${player}-combo-text`);
            text.innerText = `${combo}x COMBO! 🔥`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 800);
        }

        /* Feature #5: Freeze Time Lifeline */
        function useFreezeTime(player) {
            if (matchState[player].frozen) return;
            matchState[player].frozen = true;
            document.getElementById(`${player}-btn-freeze`).classList.add('opacity-30');
            // Freeze logic...
        }

        /* Feature #8: Send Taunt Emoji */
        function sendTaunt(emoji) {
            confetti({ particleCount: 15, scalar: 1.2, shapes: ['square'] });
        }

        function startMatchTimer() {
            if (matchState.interval) clearInterval(matchState.interval);
            matchState.timer = 15;
            matchState.interval = setInterval(() => {
                matchState.timer--;
                document.getElementById('live-timer-badge').innerText = `⏳ ${matchState.timer}s`;
                if (matchState.timer <= 0) {
                    endMatch();
                }
            }, 1000);
        }

        function endMatch() {
            clearInterval(matchState.interval);
            confetti({ particleCount: 100, spread: 70 });

            document.getElementById('winner-title').innerText = matchState.p1.score >= matchState.p2.score ? "PEMAIN 1 MENANG! 🏆" : "PEMAIN 2 MENANG! 🏆";

            // Feature #10: Render wrong answer review
            const wrongList = document.getElementById('wrong-words-list');
            wrongList.innerHTML = matchState.wrongReview.length ? '' : '<li>Sempurna! Tidak ada jawaban salah. 🎉</li>';
            matchState.wrongReview.forEach(item => {
                wrongList.innerHTML += `<li>• <strong class="text-white">${item.word}</strong>: Jawaban Benar = <span class="text-emerald-400">${item.correct}</span></li>`;
            });

            // Feature #12: Render Badges
            document.getElementById('unlocked-badges').innerHTML = `
                <span class="bg-amber-950 border border-amber-500/40 text-amber-300 text-[10px] font-bold px-2 py-1 rounded-lg">⚡ Speed Demon</span>
                <span class="bg-indigo-950 border border-indigo-500/40 text-indigo-300 text-[10px] font-bold px-2 py-1 rounded-lg">🎯 Sharpshooter</span>
            `;

            document.getElementById('recap-modal').classList.remove('hidden');
        }

        function speakWord(player) {
            const word = document.getElementById(`${player}-question`).innerText;
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function useFiftyFifty(player) {
            document.getElementById(`${player}-btn-5050`).classList.add('opacity-30');
        }

        function useHint(player) {
            document.getElementById(`${player}-btn-hint`).classList.add('opacity-30');
            document.getElementById(`${player}-hint-text`).classList.remove('hidden');
            document.getElementById(`${player}-hint-text`).innerText = "Hint: Pahami konteks kata!";
        }
    </script>
</body>
</html>
