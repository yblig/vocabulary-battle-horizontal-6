<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Emoji Super Fun!</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #4f46e5;
            --accent: #ff007f;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen { display: none; }
        .screen.active { display: block; }

        h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        /* Mode Selection */
        .mode-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .btn-mode {
            padding: 12px 20px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-mode.selected, .btn-mode:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }

        /* Primary Button */
        .btn-main {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 0, 127, 0.4);
        }

        .btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(255, 0, 127, 0.6);
        }

        /* Countdown Overlay */
        .countdown-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .countdown-number {
            font-size: 6rem;
            font-weight: 900;
            color: var(--primary);
            animation: popScale 0.8s ease-in-out infinite;
        }

        @keyframes popScale {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Game Elements */
        .team-badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .emoji-box {
            font-size: 4.5rem;
            background: #f3f4f6;
            padding: 20px;
            border-radius: 20px;
            margin: 15px 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Timer Section */
        .timer-container {
            margin: 15px 0;
        }

        .timer-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .progress-bar-bg {
            background: #e5e7eb;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #10b981, #ef4444);
            height: 100%;
            width: 100%;
            transition: width 1s linear;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-option {
            background: white;
            border: 2px solid #e5e7eb;
            padding: 15px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-option:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f4f5ff;
            transform: translateY(-2px);
        }

        .btn-option.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
            animation: pulse 0.5s;
        }

        .btn-option.wrong {
            background: var(--danger) !important;
            color: white !important;
            border-color: var(--danger) !important;
        }

        /* Power-ups */
        .powerups {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-powerup {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-powerup:hover:not(:disabled) {
            background: #e5e7eb;
        }

        .btn-powerup:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Confetti Overlay */
        #confetti-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <canvas id="confetti-canvas"></canvas>

        <!-- SCREEN 1: START & MODE SELECTION -->
        <div id="screen-start" class="screen active">
            <h1>🎭 Tebak Emoji Fun</h1>
            <p class="subtitle">Pilih Mode Kesulitan Sebelum Mulai Game!</p>

            <div class="mode-container">
                <button class="btn-mode selected" onclick="selectMode('easy', this)">Easy (20s)</button>
                <button class="btn-mode" onclick="selectMode('medium', this)">Medium (12s)</button>
                <button class="btn-mode" onclick="selectMode('hard', this)">Hard (6s)</button>
            </div>

            <button class="btn-main" onclick="startGame()">Mulai Permainan 🚀</button>
        </div>

        <!-- COUNTDOWN OVERLAY -->
        <div id="countdown-overlay" class="countdown-overlay" style="display: none;">
            <div id="countdown-text" class="countdown-number">3</div>
        </div>

        <!-- SCREEN 2: GAMEPLAY -->
        <div id="screen-game" class="screen">
            <div class="team-badge" id="team-turn-display">Giliran: Tim A</div>
            <div class="emoji-box" id="emoji-display">🍿🎬</div>

            <!-- Timer Section -->
            <div class="timer-container">
                <div class="timer-text" id="timer-display">⏱️ 20 DETIK</div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="timer-bar"></div>
                </div>
            </div>

            <div class="options-grid" id="options-container"></div>

            <!-- Power-Ups -->
            <div class="powerups">
                <button class="btn-powerup" id="btn-5050" onclick="use5050()">⚡ 50:50</button>
                <button class="btn-powerup" id="btn-time" onclick="useExtraTime()">⌛ +10s Waktu</button>
            </div>
        </div>

        <!-- SCREEN 3: RESULT -->
        <div id="screen-result" class="screen">
            <h1>🏆 Game Selesai!</h1>
            <p class="subtitle" id="winner-text">Selamat untuk pemenang!</p>
            
            <div style="margin: 20px 0; font-size: 1.2rem; line-height: 1.8;">
                <p><strong>Skor Tim A:</strong> <span id="score-team-a">0</span></p>
                <p><strong>Skor Tim B:</strong> <span id="score-team-b">0</span></p>
            </div>

            <button class="btn-main" onclick="resetGame()">Main Lagi 🔄</button>
        </div>
    </div>

    <script>
        // --- Web Audio API (Sound Effects Synthesizer) ---
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (AudioCtx.state === 'suspended') AudioCtx.resume();
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.connect(gain);
            gain.connect(AudioCtx.destination);

            const now = AudioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3); // A5
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.3); // A2
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'timeout') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // --- Master Bank Soal (Jawaban & Opsi Tetap KONSISTEN) ---
        const questionBank = [
            { emoji: "🍿🎬", options: ["Bioskop", "Restoran", "Festival Musik", "Taman Bermain"], answer: "Bioskop" },
            { emoji: "🐱👓", options: ["Kucing Keren", "Kucing Pintar", "Detektif Hewan", "Dokter Hewan"], answer: "Kucing Keren" },
            { emoji: "🚀🌕", options: ["Terbang Tinggi", "Misi Luar Angkasa", "Malam Hari", "Satelit Buatan"], answer: "Misi Luar Angkasa" },
            { emoji: "🍔🍟🥤", options: ["Makanan Sehat", "Fast Food", "Pesta Ulang Tahun", "Piknik Bersama"], answer: "Fast Food" },
            { emoji: "⚽🏆", options: ["Juara Sepak Bola", "Latihan Olahraga", "Nonton Bola", "Beli Sepatu"], answer: "Juara Sepak Bola" }
        ];

        // Game Settings
        const modeDurations = { easy: 20, medium: 12, hard: 6 };
        let selectedMode = 'easy';
        let currentQuestionIndex = 0;
        let currentTeam = 'A'; // 'A' atau 'B'
        let scores = { A: 0, B: 0 };
        let powerupsUsed = { A: { f50: false, time: false }, B: { f50: false, time: false } };

        let timerInterval = null;
        let timeLeft = 0;
        let totalTime = 20;

        function selectMode(mode, element) {
            selectedMode = mode;
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('selected'));
            element.classList.add('selected');
            playSound('tick');
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            scores = { A: 0, B: 0 };
            currentQuestionIndex = 0;
            currentTeam = 'A';
            powerupsUsed = { A: { f50: false, time: false }, B: { f50: false, time: false } };
            totalTime = modeDurations[selectedMode];
            
            runCountdown(() => {
                switchScreen('screen-game');
                loadQuestion();
            });
        }

        // --- Fix Countdown 3, 2, 1 lengkap ---
        function runCountdown(callback) {
            const overlay = document.getElementById('countdown-overlay');
            const textElem = document.getElementById('countdown-text');
            overlay.style.display = 'flex';
            
            let count = 3;
            textElem.innerText = count;
            playSound('tick');

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    textElem.innerText = count;
                    playSound('tick');
                } else if (count === 0) {
                    textElem.innerText = "MULAI!";
                    playSound('tick');
                } else {
                    clearInterval(interval);
                    overlay.style.display = 'none';
                    callback();
                }
            }, 800);
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            
            const q = questionBank[currentQuestionIndex];
            document.getElementById('team-turn-display').innerText = `Giliran: Tim ${currentTeam}`;
            document.getElementById('emoji-display').innerText = q.emoji;

            // Power-ups status update
            document.getElementById('btn-5050').disabled = powerupsUsed[currentTeam].f50;
            document.getElementById('btn-time').disabled = powerupsUsed[currentTeam].time;

            // Render opsi jawaban (Urutan KONSISTEN & TDK DI-RANDOMIZE)
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt, btn);
                container.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = totalTime;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();

                if (timeLeft <= 3 && timeLeft > 0) playSound('tick');

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound('timeout');
                    highlightCorrectAnswer();
                    setTimeout(nextTurn, 1500);
                }
            }, 1000);
        }

        function updateTimerUI() {
            document.getElementById('timer-display').innerText = `⏱️ ${timeLeft} DETIK`;
            const percentage = (timeLeft / totalTime) * 100;
            document.getElementById('timer-bar').style.width = `${Math.max(0, percentage)}%`;
        }

        function handleAnswer(selectedOption, btnElement) {
            clearInterval(timerInterval);
            const q = questionBank[currentQuestionIndex];
            const allButtons = document.querySelectorAll('.btn-option');
            allButtons.forEach(b => b.disabled = true);

            if (selectedOption === q.answer) {
                btnElement.classList.add('correct');
                playSound('correct');
                scores[currentTeam] += 10;
            } else {
                btnElement.classList.add('wrong');
                playSound('wrong');
                highlightCorrectAnswer();
            }

            setTimeout(nextTurn, 1500);
        }

        function highlightCorrectAnswer() {
            const q = questionBank[currentQuestionIndex];
            document.querySelectorAll('.btn-option').forEach(b => {
                if (b.innerText === q.answer) {
                    b.classList.add('correct');
                }
            });
        }

        function nextTurn() {
            if (currentTeam === 'A') {
                currentTeam = 'B';
            } else {
                currentTeam = 'A';
                currentQuestionIndex++;
            }

            if (currentQuestionIndex < questionBank.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        // --- Power-Up Functions ---
        function use5050() {
            powerupsUsed[currentTeam].f50 = true;
            document.getElementById('btn-5050').disabled = true;
            playSound('tick');

            const q = questionBank[currentQuestionIndex];
            const buttons = Array.from(document.querySelectorAll('.btn-option'));
            let removed = 0;

            buttons.forEach(btn => {
                if (btn.innerText !== q.answer && removed < 2) {
                    btn.style.visibility = 'hidden';
                    removed++;
                }
            });
        }

        function useExtraTime() {
            powerupsUsed[currentTeam].time = true;
            document.getElementById('btn-time').disabled = true;
            playSound('tick');
            timeLeft += 10;
            totalTime += 10;
            updateTimerUI();
        }

        function endGame() {
            switchScreen('screen-result');
            playSound('win');
            startConfetti();

            document.getElementById('score-team-a').innerText = scores.A;
            document.getElementById('score-team-b').innerText = scores.B;

            const winText = document.getElementById('winner-text');
            if (scores.A > scores.B) {
                winText.innerText = "🎉 Selamat! Tim A Keluar Sebagai Juara!";
            } else if (scores.B > scores.A) {
                winText.innerText = "🎉 Selamat! Tim B Keluar Sebagai Juara!";
            } else {
                winText.innerText = "🤝 Permainan Seri! Kedua Tim Sama-sama Hebat!";
            }
        }

        function resetGame() {
            switchScreen('screen-start');
        }

        // --- Visual Confetti Effect ---
        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            const pieces = [];
            const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b'];

            for (let i = 0; i < 80; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 3 + 2,
                    rotation: Math.random() * 360
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    ctx.save();
                    ctx.fillStyle = p.color;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();

                    p.y += p.speed;
                    p.rotation += 0.05;

                    if (p.y > canvas.height) p.y = -20;
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
