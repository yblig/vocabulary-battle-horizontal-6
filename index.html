<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tebak Emoji Super Keren!</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #ec4899;
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #d946ef 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1f2937;
        }

        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .screen { display: none; text-align: center; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--primary-dark);
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        p.desc {
            color: #6b7280;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .section-title {
            font-weight: 700;
            color: #374151;
            margin: 15px 0 8px 0;
            text-align: left;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Group Buttons (Mode & Category) */
        .option-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-select {
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-select.active, .btn-select:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-action {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
            width: 100%;
        }

        .btn-action:hover {
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(236, 72, 153, 0.6);
        }

        /* Countdown Overlay */
        .countdown-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .countdown-number {
            font-size: 7rem;
            font-weight: 900;
            color: var(--primary);
            animation: popIn 0.7s infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Game Screen Elements */
        .badge-team {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary-dark);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .emoji-display-box {
            background: #f9fafb;
            border: 3px dashed #d1d5db;
            border-radius: 24px;
            padding: 25px;
            font-size: 4.5rem;
            margin-bottom: 15px;
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Real-time Timer bawah Soal */
        .timer-box {
            background: #f3f4f6;
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .timer-number {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #ef4444);
            width: 100%;
            transition: width 1s linear;
        }

        /* Options Grid */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-answer {
            background: white;
            border: 2px solid #e5e7eb;
            padding: 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-answer:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f5f3ff;
            transform: translateY(-2px);
        }

        .btn-answer.correct {
            background: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-answer.wrong {
            background: var(--danger) !important;
            color: white !important;
            border-color: var(--danger) !important;
        }

        /* Powerups */
        .powerup-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-powerup {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-powerup:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #canvas-confetti {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <canvas id="canvas-confetti"></canvas>

        <!-- SCREEN 1: PENGATURAN MODE & KATEGORI -->
        <div id="screen-setup" class="screen active">
            <h1>🧩 Tebak Emoji Party</h1>
            <p class="desc">Atur mode permainan dan kategori emoji sebelum tanding!</p>

            <div class="section-title">1. Pilih Kategori Emoji:</div>
            <div class="option-group" id="category-group">
                <button class="btn-select active" onclick="setCategory('film', this)">🎬 Film</button>
                <button class="btn-select" onclick="setCategory('makanan', this)">🍔 Makanan</button>
                <button class="btn-select" onclick="setCategory('olahraga', this)">⚽ Olahraga</button>
                <button class="btn-select" onclick="setCategory('hewan', this)">🦁 Hewan</button>
            </div>

            <div class="section-title">2. Pilih Tingkat Kesulitan (Waktu):</div>
            <div class="option-group" id="mode-group">
                <button class="btn-select active" onclick="setDifficulty('easy', this)">Easy (20s)</button>
                <button class="btn-select" onclick="setDifficulty('medium', this)">Medium (12s)</button>
                <button class="btn-select" onclick="setDifficulty('hard', this)">Hard (6s)</button>
            </div>

            <button class="btn-action" onclick="prepareGame()">MULAI GAME 🚀</button>
        </div>

        <!-- COUNTDOWN OVERLAY -->
        <div id="countdown-layer" class="countdown-overlay" style="display: none;">
            <div id="countdown-val" class="countdown-number">3</div>
        </div>

        <!-- SCREEN 2: GAMEPLAY -->
        <div id="screen-game" class="screen">
            <div class="badge-team" id="display-team">Giliran: Tim A</div>
            
            <div class="emoji-display-box" id="display-emoji">🍿🎬</div>

            <!-- Timer di Bawah Soal -->
            <div class="timer-box">
                <div class="timer-number" id="display-timer">⏱️ 20 DETIK</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="fill-timer"></div>
                </div>
            </div>

            <div class="answers-grid" id="grid-answers"></div>

            <div class="powerup-bar">
                <button class="btn-powerup" id="pwr-5050" onclick="trigger5050()">⚡ Power 50:50</button>
                <button class="btn-powerup" id="pwr-time" onclick="triggerExtraTime()">⌛ +10s Waktu</button>
            </div>
        </div>

        <!-- SCREEN 3: HASIL AKHIR -->
        <div id="screen-result" class="screen">
            <h1>🏆 Hasil Pertandingan</h1>
            <p class="desc" id="display-winner">Selamat untuk para pemenang!</p>

            <div style="background: #f9fafb; padding: 20px; border-radius: 20px; margin: 20px 0; font-size: 1.2rem;">
                <p style="margin-bottom: 10px;"><strong>Skor Tim A:</strong> <span id="score-a">0</span></p>
                <p><strong>Skor Tim B:</strong> <span id="score-b">0</span></p>
            </div>

            <button class="btn-action" onclick="restartSetup()">MAIN LAGI 🔄</button>
        </div>
    </div>

    <script>
        // --- Synthesized Sound Effects (Audio Web API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSFX(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'tick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(650, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'timeout') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(140, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.1);
                osc.frequency.setValueAtTime(659.25, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        // --- Master Data Bank Soal per Kategori ---
        const questionDatabase = {
            film: [
                { emoji: "🍿🎬", options: ["Bioskop", "Restoran", "Konser Musik", "Taman Bermain"], answer: "Bioskop" },
                { emoji: "🕷️🧍", options: ["Spider-Man", "Batman", "Superman", "Iron Man"], answer: "Spider-Man" },
                { emoji: "🦁👑", options: ["The Lion King", "Madagascar", "Tarzan", "Zootopia"], answer: "The Lion King" }
            ],
            makanan: [
                { emoji: "🍔🍟🥤", options: ["Fast Food", "Sarapan", "Pesta Kue", "Barbeque"], answer: "Fast Food" },
                { emoji: "🍕🇮🇹", options: ["Pizza Italy", "Roti Bakar", "Pasta Spaghetti", "Kebab"], answer: "Pizza Italy" },
                { emoji: "🍣🇯🇵", options: ["Sushi Japan", "Ramen", "Dimsum", "Takoyaki"], answer: "Sushi Japan" }
            ],
            olahraga: [
                { emoji: "⚽🏆", options: ["Juara Sepak Bola", "Basket", "Lari Marathon", "Badminton"], answer: "Juara Sepak Bola" },
                { emoji: "🥊🥇", options: ["Juara Tinju", "Karateman", "Taekwondo", "Silat"], answer: "Juara Tinju" },
                { emoji: "🏊‍♂️🌊", options: ["Renang Laut", "Mancing", "Lancar Selancar", "Penyelam"], answer: "Renang Laut" }
            ],
            hewan: [
                { emoji: "🐱👓", options: ["Kucing Keren", "Anjing Pintar", "Monyet Lucu", "Kelinci Gemoy"], answer: "Kucing Keren" },
                { emoji: "🐼🎋", options: ["Panda Makan Bambu", "Koala", "Beruang Kutub", "Kangguru"], answer: "Panda Makan Bambu" },
                { emoji: "🦉🌙", options: ["Burung Hantu", "Elang", "Kelelawar", "Burung Cendrawasih"], answer: "Burung Hantu" }
            ]
        };

        // State Management
        let selectedCategory = 'film';
        let selectedDifficulty = 'easy';
        const difficultyTimes = { easy: 20, medium: 12, hard: 6 };

        let currentQuestions = [];
        let questionIndex = 0;
        let activeTeam = 'A';
        let teamScores = { A: 0, B: 0 };
        let powerupState = { A: { f50: false, time: false }, B: { f50: false, time: false } };

        let timerRef = null;
        let secondsLeft = 0;
        let maxTime = 20;

        function setCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('#category-group .btn-select').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            playSFX('tick');
        }

        function setDifficulty(diff, btn) {
            selectedDifficulty = diff;
            document.querySelectorAll('#mode-group .btn-select').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            playSFX('tick');
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function prepareGame() {
            teamScores = { A: 0, B: 0 };
            questionIndex = 0;
            activeTeam = 'A';
            powerupState = { A: { f50: false, time: false }, B: { f50: false, time: false } };
            
            currentQuestions = questionDatabase[selectedCategory];
            maxTime = difficultyTimes[selectedDifficulty];

            startCountdown(() => {
                showScreen('screen-game');
                renderQuestion();
            });
        }

        // --- Countdown Fix (3, 2, 1 lengkap) ---
        function startCountdown(onComplete) {
            const overlay = document.getElementById('countdown-layer');
            const numDisplay = document.getElementById('countdown-val');
            overlay.style.display = 'flex';

            let count = 3;
            numDisplay.innerText = count;
            playSFX('tick');

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    numDisplay.innerText = count;
                    playSFX('tick');
                } else if (count === 0) {
                    numDisplay.innerText = "START!";
                    playSFX('tick');
                } else {
                    clearInterval(interval);
                    overlay.style.display = 'none';
                    onComplete();
                }
            }, 800);
        }

        function renderQuestion() {
            clearInterval(timerRef);
            const q = currentQuestions[questionIndex];

            document.getElementById('display-team').innerText = `Giliran: Tim ${activeTeam}`;
            document.getElementById('display-emoji').innerText = q.emoji;

            // Power-up button states
            document.getElementById('pwr-5050').disabled = powerupState[activeTeam].f50;
            document.getElementById('pwr-time').disabled = powerupState[activeTeam].time;

            // Render opsi jawaban (TIDAK DIACAK agar konsisten)
            const grid = document.getElementById('grid-answers');
            grid.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-answer';
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(opt, btn);
                grid.appendChild(btn);
            });

            beginTimer();
        }

        function beginTimer() {
            secondsLeft = maxTime;
            updateTimerDisplay();

            timerRef = setInterval(() => {
                secondsLeft--;
                updateTimerDisplay();

                if (secondsLeft <= 3 && secondsLeft > 0) playSFX('tick');

                if (secondsLeft <= 0) {
                    clearInterval(timerRef);
                    playSFX('timeout');
                    revealCorrect();
                    setTimeout(switchTurn, 1500);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            document.getElementById('display-timer').innerText = `⏱️ ${secondsLeft} DETIK`;
            const pct = (secondsLeft / maxTime) * 100;
            document.getElementById('fill-timer').style.width = `${Math.max(0, pct)}%`;
        }

        function selectAnswer(chosen, btn) {
            clearInterval(timerRef);
            const q = currentQuestions[questionIndex];
            document.querySelectorAll('.btn-answer').forEach(b => b.disabled = true);

            if (chosen === q.answer) {
                btn.classList.add('correct');
                playSFX('correct');
                teamScores[activeTeam] += 10;
            } else {
                btn.classList.add('wrong');
                playSFX('wrong');
                revealCorrect();
            }

            setTimeout(switchTurn, 1500);
        }

        function revealCorrect() {
            const q = currentQuestions[questionIndex];
            document.querySelectorAll('.btn-answer').forEach(b => {
                if (b.innerText === q.answer) b.classList.add('correct');
            });
        }

        function switchTurn() {
            if (activeTeam === 'A') {
                activeTeam = 'B';
            } else {
                activeTeam = 'A';
                questionIndex++;
            }

            if (questionIndex < currentQuestions.length) {
                renderQuestion();
            } else {
                finishGame();
            }
        }

        // --- Powerups ---
        function trigger5050() {
            powerupState[activeTeam].f50 = true;
            document.getElementById('pwr-5050').disabled = true;
            playSFX('tick');

            const q = currentQuestions[questionIndex];
            const buttons = Array.from(document.querySelectorAll('.btn-answer'));
            let removedCount = 0;

            buttons.forEach(btn => {
                if (btn.innerText !== q.answer && removedCount < 2) {
                    btn.style.visibility = 'hidden';
                    removedCount++;
                }
            });
        }

        function triggerExtraTime() {
            powerupState[activeTeam].time = true;
            document.getElementById('pwr-time').disabled = true;
            playSFX('tick');
            secondsLeft += 10;
            maxTime += 10;
            updateTimerDisplay();
        }

        function finishGame() {
            showScreen('screen-result');
            playSFX('win');
            launchConfetti();

            document.getElementById('score-a').innerText = teamScores.A;
            document.getElementById('score-b').innerText = teamScores.B;

            const winBox = document.getElementById('display-winner');
            if (teamScores.A > teamScores.B) {
                winBox.innerText = "🎉 Tim A Menang!";
            } else if (teamScores.B > teamScores.A) {
                winBox.innerText = "🎉 Tim B Menang!";
            } else {
                winBox.innerText = "🤝 Hasil Seri!";
            }
        }

        function restartSetup() {
            showScreen('screen-setup');
        }

        // --- Confetti ---
        function launchConfetti() {
            const cvs = document.getElementById('canvas-confetti');
            const ctx = cvs.getContext('2d');
            cvs.width = cvs.parentElement.clientWidth;
            cvs.height = cvs.parentElement.clientHeight;

            const items = [];
            const palette = ['#ec4899', '#8b5cf6', '#10b981', '#f59e0b', '#3b82f6'];

            for (let i = 0; i < 70; i++) {
                items.push({
                    x: Math.random() * cvs.width,
                    y: Math.random() * cvs.height - cvs.height,
                    sz: Math.random() * 8 + 4,
                    color: palette[Math.floor(Math.random() * palette.length)],
                    sp: Math.random() * 3 + 2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, cvs.width, cvs.height);
                items.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.sz, p.sz);
                    p.y += p.sp;
                    if (p.y > cvs.height) p.y = -10;
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
