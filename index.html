<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Game Multi-Touch & Fullscreen</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* Mencegah zoom/scroll default saat banyak sentuhan */
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1e1e2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    /* Container UTAMA MENU */
    #menu-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2b1055, #7597de);
      z-index: 10;
    }

    #menu-screen h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn {
      padding: 15px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: #ff4757;
      border: none;
      border-radius: 50px;
      box-shadow: 0 8px 15px rgba(255, 71, 87, 0.4);
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 10px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* Tombol Fullscreen di Pojok kanan atas Menu */
    #fullscreen-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      backdrop-filter: blur(5px);
    }

    /* Canvas Game */
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- TAMPILAN MENU UTAMA -->
  <div id="menu-screen">
    <button id="fullscreen-btn" class="btn">fullscreen ⛶</button>
    <h1>Multi-Touch Playground</h1>
    <button id="start-btn" class="btn">Mulai Main 🎮</button>
  </div>

  <!-- CANVAS UNTUK GAME -->
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menuScreen = document.getElementById('menu-screen');
    const startBtn = document.getElementById('start-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    // Menyesuaikan Ukuran Canvas
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // FITUR FULLSCREEN
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          fullscreenBtn.innerText = "Exit Fullscreen ✕";
        }).catch(err => {
          console.log(`Gagal Fullscreen: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          fullscreenBtn.innerText = "Fullscreen ⛶";
        }
      }
    });

    // SISTEM MULTI-TOUCH
    // Menggunakan Map untuk menyimpan posisi setiap jari berdasarkan touch.identifier
    const activeTouches = new Map();

    // Warna acak untuk setiap sentuhan jari baru
    const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#eccc68', '#70a1ff', '#ff6b81'];

    function handleTouchStart(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const color = colors[Math.floor(Math.random() * colors.length)];
        activeTouches.set(touch.identifier, {
          x: touch.clientX,
          y: touch.clientY,
          color: color,
          radius: 35
        });
      }
    }

    function handleTouchMove(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (activeTouches.has(touch.identifier)) {
          const t = activeTouches.get(touch.identifier);
          t.x = touch.clientX;
          t.y = touch.clientY;
        }
      }
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        activeTouches.delete(touch.identifier);
      }
    }

    // Event Listener Multi-Touch untuk Canvas
    canvas.addEventListener('touchstart', handleTouchStart, false);
    canvas.addEventListener('touchmove', handleTouchMove, false);
    canvas.addEventListener('touchend', handleTouchEnd, false);
    canvas.addEventListener('touchcancel', handleTouchEnd, false);

    // LOOP GAMBAR/ANIMASI
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Gambar lingkaran di setiap titik jari yang menyentuh layar
      activeTouches.forEach((touch) => {
        ctx.beginPath();
        ctx.arc(touch.x, touch.y, touch.radius, 0, Math.PI * 2);
        ctx.fillStyle = touch.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = touch.color;
        ctx.fill();
        ctx.closePath();
      });

      requestAnimationFrame(render);
    }

    // MULAI GAME DARI MENU
    startBtn.addEventListener('click', () => {
      menuScreen.style.display = 'none';
      render();
    });
  </script>
</body>
</html>
